name: Compilar Lolz Kernel 4.9 con KernelSU

on:
  push:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Compilación de Kernel para Redmi 7A (pine)
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar Código Fuente del Kernel
        uses: actions/checkout@v4

      - name: Instalar Dependencias de Compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            git \
            zip \
            unzip \
            curl \
            python3 \
            cpio \
            lld \
            clang

      - name: Descargar Toolchain Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/proton-clang

      - name: Inyectar KernelSU v0.9.5 y Forzar Compilación
        run: |
          # 1. Inyectar KernelSU v0.9.5
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

          # 2. Forzar compilación incondicional de los módulos de KernelSU
          if [ -d "drivers/kernelsu" ]; then
            sed -i 's/obj-$(CONFIG_KSU)/obj-y/g' drivers/kernelsu/Makefile 2>/dev/null || true
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi

          # 3. Parchear error de MACH_FAMILY_OLIVE en el driver de regulador para Redmi 7A (pine)
          if [ -f "drivers/regulator/qpnp-lcdb-regulator.c" ]; then
            sed -i 's/if (mi439_mach_get_family() == MACH_FAMILY_OLIVE)/if (0)/g' drivers/regulator/qpnp-lcdb-regulator.c
          fi

      - name: Compilar Kernel
        run: |
          export PATH="$HOME/proton-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          DEFCONFIG_FILE=$(find arch/arm64/configs -name "*pine*" -o -name "*lolz*" | head -n 1)
          DEFCONFIG_NAME=$(basename "$DEFCONFIG_FILE")

          mkdir -p out
          make O=out "$DEFCONFIG_NAME"

          # Inyectar variables de KernelSU y Kprobes en out/.config
          echo "CONFIG_KPROBES=y" >> out/.config
          echo "CONFIG_HAVE_KPROBES=y" >> out/.config
          echo "CONFIG_KPROBE_EVENTS=y" >> out/.config
          echo "CONFIG_KALLSYMS=y" >> out/.config
          echo "CONFIG_KALLSYMS_ALL=y" >> out/.config
          echo "CONFIG_OVERLAY_FS=y" >> out/.config
          echo "CONFIG_KSU=y" >> out/.config

          make O=out olddefconfig
          make -j$(nproc --all) O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-Wno-error -Wno-implicit-function-declaration"

      - name: Empaquetar con AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          IMAGE=$(find out/arch/arm64/boot/ -name "Image.gz-dtb" -o -name "Image.gz" | head -n 1)

          cp "$IMAGE" AnyKernel3/
          cd AnyKernel3

          sed -i 's/device.name1=.*/device.name1=pine/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=redmi7a/' anykernel.sh

          zip -r9 ../LolzKernel-4.9-KernelSU-Pine.zip * -x .git README.md *placeholder

      - name: Subir Archivo ZIP Resultante
        uses: actions/upload-artifact@v4
        with:
          name: LolzKernel-4.9-KernelSU-Pine
          path: LolzKernel-4.9-KernelSU-Pine.zip
