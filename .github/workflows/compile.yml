name: Compilar Lolz Kernel 4.9 con KernelSU

on:
  push:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Compilación de Kernel para Redmi 7A (pine)
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar Código Fuente del Kernel
        uses: actions/checkout@v4

      - name: Instalar Dependencias de Compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libelf-dev \
            git \
            zip \
            unzip \
            curl \
            python3 \
            cpio \
            lld \
            clang

      - name: Descargar Toolchain Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/proton-clang

      - name: Inyectar KernelSU v0.9.5 y Puente de Símbolos
        run: |
          # 1. Inyectar KernelSU v0.9.5 oficial
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

          # 2. Crear puente de símbolos para solucionar errores de ld.lld (ksu_*_hook)
          cat <<'EOF' > drivers/ksu_bridge.c
          #include <linux/types.h>

          int __attribute__((weak)) ksu_handle_execveat(int *fd, void *filename_ptr, void *argv, void *envp, int *flags) { return 0; }
          int __attribute__((weak)) ksu_handle_vfs_read(void *file_ptr, void *buf_ptr, void *count_ptr, void *pos_ptr) { return 0; }
          int __attribute__((weak)) ksu_handle_faccessat(int *dfd, void *filename_user, int *mode, int *flags) { return 0; }
          int __attribute__((weak)) ksu_handle_stat(int *dfd, void *filename_user, int *flags) { return 0; }
          int __attribute__((weak)) ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value) { return 0; }

          int __attribute__((weak)) ksu_execveat_hook(int *fd, void *filename_ptr, void *argv, void *envp, int *flags) {
              return ksu_handle_execveat(fd, filename_ptr, argv, envp, flags);
          }
          int __attribute__((weak)) ksu_vfs_read_hook(void *file_ptr, void *buf_ptr, void *count_ptr, void *pos_ptr) {
              return ksu_handle_vfs_read(file_ptr, buf_ptr, count_ptr, pos_ptr);
          }
          int __attribute__((weak)) ksu_input_hook(unsigned int *type, unsigned int *code, int *value) {
              return ksu_handle_input_handle_event(type, code, value);
          }
          int __attribute__((weak)) ksu_faccessat_hook(int *dfd, void *filename_user, int *mode, int *flags) {
              return ksu_handle_faccessat(dfd, filename_user, mode, flags);
          }
          int __attribute__((weak)) ksu_stat_hook(int *dfd, void *filename_user, int *flags) {
              return ksu_handle_stat(dfd, filename_user, flags);
          }
          EOF

          # 3. Registrar ksu_bridge.o en el Makefile del directorio drivers
          if ! grep -q "ksu_bridge.o" drivers/Makefile; then
            echo "obj-y += ksu_bridge.o" >> drivers/Makefile
          fi

          # 4. Parchear error de MACH_FAMILY_OLIVE en regulador de pantalla (si existe)
          if [ -f "drivers/regulator/qpnp-lcdb-regulator.c" ]; then
            sed -i 's/if (mi439_mach_get_family() == MACH_FAMILY_OLIVE)/if (0)/g' drivers/regulator/qpnp-lcdb-regulator.c
          fi

          # 5. Inyectar configuraciones requeridas en el defconfig de pine
          DEFCONFIG_FILE=$(find arch/arm64/configs -name "*pine*" -o -name "*lolz*" | head -n 1)
          if [ -z "$DEFCONFIG_FILE" ]; then
            DEFCONFIG_FILE="arch/arm64/configs/pine_defconfig"
          fi

          cat <<EOT >> "$DEFCONFIG_FILE"
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU=y
          EOT

      - name: Compilar Kernel
        run: |
          export PATH="$HOME/proton-clang/bin:$PATH"
          
          DEFCONFIG_FILE=$(find arch/arm64/configs -name "*pine*" -o -name "*lolz*" | head -n 1)
          DEFCONFIG_NAME=$(basename "$DEFCONFIG_FILE")

          mkdir -p out
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- "$DEFCONFIG_NAME"

          # Asegurar flags activos en la configuración final
          scripts/config --file out/.config --enable CONFIG_KSU
          scripts/config --file out/.config --enable CONFIG_KPROBES
          scripts/config --file out/.config --enable CONFIG_HAVE_KPROBES
          scripts/config --file out/.config --enable CONFIG_KPROBE_EVENTS
          scripts/config --file out/.config --enable CONFIG_OVERLAY_FS

          make O=out ARCH=arm64 olddefconfig

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -DCONFIG_KSU=1"

      - name: Empaquetar con AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          IMAGE=$(find out/arch/arm64/boot/ -name "Image.gz-dtb" -o -name "Image.gz" | head -n 1)

          if [ -z "$IMAGE" ]; then
            echo "ERROR: No se encontró la imagen del kernel compilado en out/"
            exit 1
          fi

          cp "$IMAGE" AnyKernel3/

          DTBO=$(find out/arch/arm64/boot/ -name "dtbo.img" | head -n 1)
          if [ -n "$DTBO" ] && [ -f "$DTBO" ]; then
            cp "$DTBO" AnyKernel3/
          fi

          cd AnyKernel3

          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=pine/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=redmi7a/' anykernel.sh
          sed -i 's/block=.*/block=auto;/' anykernel.sh

          zip -r9 ../LolzKernel-4.9-KernelSU-Pine.zip * -x .git README.md *placeholder

      - name: Subir Archivo ZIP Resultante
        uses: actions/upload-artifact@v4
        with:
          name: LolzKernel-4.9-KernelSU-Pine
          path: LolzKernel-4.9-KernelSU-Pine.zip
